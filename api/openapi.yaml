openapi: 3.1.0
info:
  title: 房屋中介小程序 API
  version: 0.17.0
  description: |
    覆盖 M1–M7 已实现接口：微信登录、资料、地图聚合、房源详情/发布、
    小区联想、联系请求与通知、30 天巡检、小亿文字/语音（准双工 + 打断）、
    docx/xlsx 导入、管理站文字/图片/视频录入并匹配房东、管理站审核/审计/统计。
    自主获客（3.12/3.13）已开始落地：批次 1 数据模型与管理站骨架（信息源 / 线索列表）已就绪，
    采集、LLM 评分、人工复核联系、跟进状态机在后续批次补齐；PC 微信自动化（3.11）尚未实现。
servers:
  - url: http://localhost:8080
    description: local
tags:
  - name: auth
  - name: user
  - name: property
  - name: community
  - name: contact
  - name: assistant
  - name: voice
  - name: admin
  - name: intake
  - name: prospect
paths:
  /healthz:
    get:
      summary: 健康检查
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /v1/auth/wechat/login:
    post:
      tags: [auth]
      summary: 微信登录（开发态可用 devOpenid）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                devOpenid:
                  type: string
                  description: 仅 APP_ENV=dev 且 DEV_LOGIN_ENABLED=true 时生效；code 与 devOpenid 至少一个
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
  /v1/auth/wechat/phone:
    post:
      tags: [auth]
      summary: 手机号授权 code 换手机号并绑定
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                devPhone:
                  type: string
                  description: 仅开发态生效
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /v1/me:
    get:
      tags: [user]
      summary: 当前用户
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /v1/profile:
    post:
      tags: [user]
      summary: 填写姓氏与角色
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                surname:
                  type: string
                  minLength: 1
                  maxLength: 10
                role:
                  type: string
                  enum: [landlord, tenant]
              required: [surname, role]
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /v1/communities/suggest:
    get:
      tags: [community]
      summary: 住宅小区联想（发布/录入时选择小区）
      security: []
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            example: "440300"
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 候选小区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySuggestEnvelope"
  /v1/properties/map:
    get:
      tags: [property]
      summary: 地图聚合/点位
      security: []
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            example: "440300"
        - name: swLat
          in: query
          required: true
          schema:
            type: number
        - name: swLng
          in: query
          required: true
          schema:
            type: number
        - name: neLat
          in: query
          required: true
          schema:
            type: number
        - name: neLng
          in: query
          required: true
          schema:
            type: number
        - name: zoom
          in: query
          required: false
          schema:
            type: integer
            minimum: 3
            maximum: 16
            default: 13
      responses:
        "200":
          description: 地图结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapEnvelope"
  /v1/buildings/suggest:
    get:
      tags: [property]
      summary: 工业园区/写字楼联想
      security: []
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 候选楼宇
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingSuggestEnvelope"
  /v1/properties/{uuid}:
    get:
      tags: [property]
      summary: 房源公开详情
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 房源详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailEnvelope"
        "404":
          description: 不存在或已下架
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/landlord/properties:
    get:
      tags: [property]
      summary: 房东我的房源列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 房源列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineListEnvelope"
    post:
      tags: [property]
      summary: 房东发布房源（命中小区名→active，否则 pending）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPropertyEnvelope"
        "403":
          description: 非房东
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/landlord/properties/{uuid}/freshness:
    post:
      tags: [property]
      summary: 房东回应 30 天在租巡检
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, rented, offline]
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/landlord/properties/imports:
    post:
      tags: [property]
      summary: 上传 docx/xlsx 导入房源
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResultEnvelope"
  /v1/landlord/contact-settings:
    get:
      tags: [contact]
      summary: 房东联系方式展示设置
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettingsEnvelope"
    put:
      tags: [contact]
      summary: 更新房东联系方式展示设置
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sharePhone, shareWechat]
              properties:
                wechatId: {type: string}
                sharePhone: {type: boolean}
                shareWechat: {type: boolean}
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/contact-requests:
    post:
      tags: [contact]
      summary: 确认联系房东并获取明文联系方式
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestInput"
      responses:
        "201":
          description: 已记录联系请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRevealEnvelope"
        "429":
          description: 频率限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/assistant/sessions:
    post:
      tags: [assistant]
      summary: 创建小亿会话
      security: []
      responses:
        "201":
          description: 会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSessionEnvelope"
  /v1/assistant/messages:
    post:
      tags: [assistant]
      summary: 小亿对话与槽位收集
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, text]
              properties:
                sessionId: {type: string, format: uuid}
                text: {type: string}
      responses:
        "200":
          description: 回复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessageEnvelope"
  /v1/assistant/recommendations:
    get:
      tags: [assistant]
      summary: 小亿推荐房源
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 推荐列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationEnvelope"
  /v1/properties/{uuid}/narration:
    get:
      tags: [assistant]
      summary: 小亿逐套解说脚本
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 解说脚本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarrationEnvelope"
  /v1/properties/{uuid}/tour:
    get:
      tags: [assistant]
      summary: 房源图片/视频/地图坐标
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 展示资源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourEnvelope"
  /v1/assistant/voice/status:
    get:
      tags: [voice]
      summary: 语音引擎能力状态（ASR/TTS/LLM 是否就绪）
      security: []
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceStatusEnvelope"
  /v1/assistant/voice/turn:
    post:
      tags: [voice]
      summary: 语音单轮（HTTP 降级：音频→文字→回复→语音 URL）
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 音频文件（wav/mp3 等），≤12MB
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 单轮结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTurnEnvelope"
        "400":
          description: 缺少 sessionId 或音频
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 语音能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/assistant/voice:
    get:
      tags: [voice]
      summary: 准双工语音 WebSocket（流式 PCM，支持 VAD 与打断）
      description: |
        WebSocket 升级接口。query 传 sessionId。
        客户端发送 16kHz/16bit/单声道 PCM 二进制帧（20ms/帧）；
        发送文本 `{"type":"interrupt"}` 可打断当前播报。
        服务端推送事件见 VoiceEvent：vad(speech/silence)、processing、asr、reply、audio、turn_end、error、interrupted。
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "101":
          description: WebSocket 切换成功
        "400":
          description: 缺少 sessionId
        "404":
          description: 会话不存在或已过期
  /v1/admin/auth/login:
    post:
      tags: [admin]
      summary: 管理站登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                totpCode:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginEnvelope"
        "401":
          description: 用户名/密码错误或需要 TOTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/admin/me:
    get:
      tags: [admin]
      summary: 当前管理员
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserEnvelope"
  /v1/admin/stats:
    get:
      tags: [admin]
      summary: 管理站统计
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsEnvelope"
  /v1/admin/properties:
    get:
      tags: [admin]
      summary: 管理站房源列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 房源列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPropertyListEnvelope"
  /v1/admin/properties/{uuid}/moderate:
    post:
      tags: [admin]
      summary: 审核/下架房源
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, offline]}
                reason: {type: string}
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/imports:
    get:
      tags: [admin]
      summary: 导入任务列表
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 50, default: 50}
      responses:
        "200":
          description: 导入任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportListEnvelope"
  /v1/admin/buildings:
    get:
      tags: [admin]
      summary: 楼宇列表
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 200, default: 200}
      responses:
        "200":
          description: 楼宇列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBuildingListEnvelope"
    post:
      tags: [admin]
      summary: 新建楼宇（工业园区/写字楼）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuildingInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/communities:
    post:
      tags: [admin]
      summary: 录入住宅小区（供发布/录入联想命中）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityInput"
      responses:
        "201":
          description: 已录入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/contacts:
    get:
      tags: [admin]
      summary: 联系记录列表
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 50, default: 50}
      responses:
        "200":
          description: 联系记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContactListEnvelope"
  /v1/admin/contacts/{uuid}:
    get:
      tags: [admin]
      summary: 联系记录详情
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContactDetailEnvelope"
  /v1/admin/audit-logs:
    get:
      tags: [admin]
      summary: 审计日志
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 100}
      responses:
        "200":
          description: 审计日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogListEnvelope"
  /v1/admin/freshness:
    get:
      tags: [admin]
      summary: 30 天巡检任务列表
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 50, default: 50}
      responses:
        "200":
          description: 巡检任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFreshnessListEnvelope"
  /v1/admin/freshness/run:
    post:
      tags: [admin]
      summary: 手动生成 30 天巡检任务
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 生成数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/auth/totp/setup:
    post:
      tags: [admin]
      summary: 生成 TOTP 密钥
      security:
        - bearerAuth: []
      responses:
        "200":
          description: secret 与 otpauth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/auth/totp/enable:
    post:
      tags: [admin]
      summary: 启用 TOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        "200":
          description: 已启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/auth/totp/disable:
    post:
      tags: [admin]
      summary: 关闭 TOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        "200":
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/admin/rentals/intake/text:
    post:
      tags: [intake]
      summary: 管理站文字录入并自动匹配房东
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, landlordPhone]
              properties:
                text: {type: string}
                landlordPhone: {type: string}
      responses:
        "201":
          description: 创建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResultEnvelope"
        "400":
          description: 房东/小区/字段不匹配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/admin/rentals/intake/media:
    post:
      tags: [intake]
      summary: 管理站图片/视频/文档录入（OCR/ASR 提取并匹配房东）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 支持 jpg/png/webp 图片、mp4/mov 视频、docx/txt/md 文档
      responses:
        "201":
          description: 解析结果
          content:
