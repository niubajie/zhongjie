          in: query
          schema: {type: string}
        - name: targetId
          in: query
          schema: {type: string}
        - name: actorId
          in: query
          schema: {type: integer, format: int64}
        - name: from
          in: query
          description: 起始时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
        - name: to
          in: query
          description: 结束时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 50, maximum: 200}
        - name: offset
          in: query
          schema: {type: integer, default: 0, minimum: 0}
      responses:
        "200":
          description: 审计日志分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectAuditLogListEnvelope"
  /v1/admin/prospects/source-stats:
    get:
      tags: [prospect]
      summary: 来源效果明细（批次14，按信息源聚合采集/线索/跟进指标，时间区间可选）
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: 起始时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
        - name: to
          in: query
          description: 结束时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
      responses:
        "200":
          description: 来源效果明细
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectSourceStatListEnvelope"
        "400":
          description: 时间参数不合法
  /v1/admin/prospects/source-stats/export:
    get:
      tags: [prospect]
      summary: 导出来源效果明细 CSV（批次14，仅聚合指标，不含正文与联系方式）
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: 起始时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
        - name: to
          in: query
          description: 结束时间（含），RFC3339 或 YYYY-MM-DD
          schema: {type: string}
      responses:
        "200":
          description: CSV 文件（UTF-8 BOM，Excel 可直接打开）
          content:
            text/csv:
              schema: {type: string, format: binary}
        "400":
          description: 时间参数不合法
  /v1/admin/prospects/batch:
    post:
      tags: [prospect]
      summary: 线索批量操作（批次15，审批/拒绝/流转/拒收，逐条执行并逐条审计）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectBatchActionRequest"
      responses:
        "200":
          description: 批量执行结果；部分成功也返回 200，逐条看 results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectBatchActionEnvelope"
        "400":
          description: 参数不合法（空列表、超过 100 条、未知 action）
  /v1/admin/prospects/{uuid}/status:
    post:
      tags: [prospect]
      summary: 手动流转线索状态（批次6，opt_out/contacted/reviewed 走专用接口）
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionLeadInput"
      responses:
        "200":
          description: 流转后的线索
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectLeadEnvelope"
  /v1/admin/prospects/{uuid}/opt-out:
    post:
      tags: [prospect]
      summary: 人工拒收（批次6，写入全局拒收名单并置为 opt_out）
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptOutLeadInput"
      responses:
        "200":
          description: 拒收后的线索
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectLeadEnvelope"
  /v1/admin/prospects/opt-outs:
    get:
      tags: [prospect]
      summary: 拒收名单列表（批次6，不返回联系方式哈希）
      security:
        - bearerAuth: []
      parameters:
        - name: leadType
          in: query
          schema: {type: string, enum: [tenant, landlord]}
        - name: limit
          in: query
          schema: {type: integer, default: 50}
      responses:
        "200":
          description: 拒收记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptOutListEnvelope"
  /v1/admin/prospects/kill-switch:
    get:
      tags: [prospect]
      summary: 查询全局停机开关状态（批次2 实现）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 停机状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchEnvelope"
    put:
      tags: [prospect]
      summary: 切换全局停机开关（批次2 实现）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [halted]
              properties:
                halted: {type: boolean}
      responses:
        "200":
          description: 切换结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
    PublicUser:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        phoneMask:
          type: string
        surname:
          type: string
        role:
          type: string
          enum: [landlord, tenant, ""]
        status:
          type: string
        profileCompleted:
          type: boolean
    AuthData:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        profileCompleted:
          type: boolean
        user:
          $ref: "#/components/schemas/PublicUser"
    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthData"
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PublicUser"
    CommunitySuggestItem:
      type: object
      properties:
        uuid: {type: string, format: uuid}
        name: {type: string}
        districtCode: {type: string}
        districtName: {type: string}
        streetCode: {type: string}
        streetName: {type: string}
        communityType: {type: string}
        lat: {type: number}
        lng: {type: number}
    CommunitySuggestData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunitySuggestItem"
    CommunitySuggestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CommunitySuggestData"
    CreateCommunityInput:
      type: object
      required: [cityCode, districtCode, name]
      properties:
        cityCode: {type: string}
        districtCode: {type: string}
        districtName: {type: string}
        streetCode: {type: string}
        streetName: {type: string}
        name: {type: string}
        aliases: {type: array, items: {type: string}}
        communityType: {type: string}
        poiId: {type: string}
        lat: {type: number}
        lng: {type: number}
    MapCluster:
      type: object
      properties:
        id: {type: string}
        districtCode: {type: string}
        districtName: {type: string}
        streetCode: {type: string}
        streetName: {type: string}
        lat: {type: number}
        lng: {type: number}
        count: {type: integer}
        level: {type: string}
    MapItem:
      type: object
      properties:
        uuid: {type: string, format: uuid}
        districtCode: {type: string}
        districtName: {type: string}
        streetCode: {type: string}
        streetName: {type: string}
        lat: {type: number}
        lng: {type: number}
        areaSqm: {type: number}
        rentCents: {type: integer}
        layout: {type: string}
        title: {type: string}
    MapData:
      type: object
      properties:
        cityCode: {type: string}
        zoom: {type: integer}
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/MapCluster"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MapItem"
    MapEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MapData"
    BuildingSuggest:
      type: object
      properties:
        uuid: {type: string, format: uuid}
        name: {type: string}
        districtCode: {type: string}
        districtName: {type: string}
        streetCode: {type: string}
        streetName: {type: string}
        buildingType: {type: string, enum: [industrial_park, office_building]}
        lat: {type: number}
        lng: {type: number}
    BuildingSuggestData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuildingSuggest"
    BuildingSuggestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BuildingSuggestData"
    CreatePropertyInput:
      type: object
      required: [areaSqm, rentCents]
      description: |
        发布门槛（v1.4）：命中小区名（传 communityUuid 或 communityName）→ active；
        传 buildingUuid 的非住宅房源走建筑联想。两者至少一个，否则校验失败。
      properties:
        communityUuid: {type: string, format: uuid}
        communityName: {type: string}
        buildingUuid: {type: string, format: uuid}
        areaSqm: {type: number, minimum: 5, maximum: 1000}
        rentCents: {type: integer, minimum: 100, maximum: 100000000}
        layout: {type: string}
        floor: {type: string}
        orientation: {type: string}
        title: {type: string}
        description: {type: string}
        imageKeys: {type: array, items: {type: string}}
